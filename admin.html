<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Walk In Tattoo | Staff Dashboard</title><style>:root{font-family:system-ui,-apple-system,sans-serif;background:#f6f6f6;color:#171717}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:24px 16px}.brand{text-align:center;letter-spacing:.15em;font-weight:800;font-size:14px}h1{text-align:center;font-size:30px}.card{background:white;border-radius:14px;padding:20px;margin:14px 0}button{border:0;background:#191919;color:white;padding:12px 16px;border-radius:9px;font-size:15px;font-weight:650;cursor:pointer;margin:4px}button:disabled{opacity:.5}.outline{background:white;color:#222;border:1px solid #aaa}.danger{background:#a11}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.muted{color:#666}.hidden{display:none}.tag{font-size:13px;background:#eee;padding:5px 9px;border-radius:7px}.error{color:#a11;white-space:pre-wrap}.entry{border-top:1px solid #ddd;padding:16px 0}.entry:first-child{border-top:0}.name{font-weight:750;font-size:19px}a{color:inherit}</style></head><body><main><div class="brand">WALK IN TATTOO · BOISE</div><h1>Staff dashboard</h1><div id="login" class="card"><p>Sign in using the shop owner's Google account.</p><button id="signin">Sign in with Google</button></div><div id="dashboard" class="hidden"><div class="card row"><div><strong>Customer waitlist</strong><p id="openStatus" class="muted">Checking status…</p></div><button id="toggle">Loading…</button></div><div class="card"><div class="row"><h2>Waiting parties: <span id="count">0</span></h2><button class="outline" id="signout">Sign out</button></div><div id="entries" class="muted">Loading…</div></div><p class="muted">This dashboard is private. Customers use the regular index.html page.</p></div><p id="message" class="error" role="alert"></p></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFirestore,doc,collection,onSnapshot,updateDoc,writeBatch} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const cfg={apiKey:'AIzaSyCMukJqqHGwv8TO9gVxqxDiVnsV0Bzl4zk',authDomain:'waitlist-9cc98.firebaseapp.com',projectId:'waitlist-9cc98',storageBucket:'waitlist-9cc98.firebasestorage.app',messagingSenderId:'682598756147',appId:'1:682598756147:web:49b7fb8802e108fc075846',measurementId:'G-26X80FDKGV'};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);let open=false,unsubs=[];
const adminEmail='garrettdagrey@gmail.com';
function message(e){$('message').textContent=typeof e==='string'?e:e.message||String(e);}
$('signin').onclick=async()=>{message('');try{let p=new GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});await signInWithPopup(auth,p);}catch(e){if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e.code)){await signInWithRedirect(auth,new GoogleAuthProvider());}else message(e);}};
getRedirectResult(auth).catch(message);
$('signout').onclick=()=>signOut(auth);
$('toggle').onclick=async()=>{let b=$('toggle');b.disabled=true;try{await updateDoc(doc(db,'settings','waitlist'),{open:!open});}catch(e){message(e);}finally{b.disabled=false;}};
function clear(){unsubs.forEach(fn=>fn());unsubs=[];}
onAuthStateChanged(auth,user=>{clear();let ok=user&&user.email?.toLowerCase()===adminEmail&&user.providerData.some(p=>p.providerId==='google.com');$('login').classList.toggle('hidden',!!ok);$('dashboard').classList.toggle('hidden',!ok);if(!ok){if(user)message('This account is not authorized. Sign in with the shop owner Google account.');return;}message('');unsubs.push(onSnapshot(doc(db,'settings','waitlist'),s=>{open=s.exists()&&s.data().open===true;$('openStatus').textContent=open?'OPEN — customers can join':'CLOSED — no new signups';$('toggle').textContent=open?'Close waitlist':'Open waitlist';},message));unsubs.push(onSnapshot(collection(db,'waitlist'),s=>{let waiting=s.docs.filter(d=>d.data().status==='waiting').sort((a,b)=>(a.data().createdAt?.seconds??Infinity)-(b.data().createdAt?.seconds??Infinity)||a.id.localeCompare(b.id));$('count').textContent=waiting.length;let container=$('entries');container.replaceChildren();if(!waiting.length){container.textContent='Nobody is waiting.';return;}waiting.forEach((d,i)=>{let data=d.data(),item=document.createElement('div');item.className='entry';let title=document.createElement('div');title.className='name';title.textContent=`#${i+1} — ${data.name||'Customer'}`;let details=document.createElement('p');details.className='muted';details.textContent=`${data.service||'Service not recorded'} · Party of ${data.partySize||'?'} · ${data.phone||'No phone'}`;let actions=document.createElement('div');let alertBtn=document.createElement('button');alertBtn.textContent='Alert';let remove=document.createElement('button');remove.className='danger';remove.textContent='Remove';async function change(status){if(status==='cancelled'&&!confirm('Remove this party from the waitlist?'))return;alertBtn.disabled=remove.disabled=true;try{let batch=writeBatch(db);batch.update(doc(db,'waitlist',d.id),{status});batch.delete(doc(db,'publicQueue',d.id));await batch.commit();}catch(e){message(e);alertBtn.disabled=remove.disabled=false;}}alertBtn.onclick=async()=>{const phone=String(data.phone||'').replace(/[^\d+]/g,'');if(!phone){message('This customer has no phone number.');return;}const text="Hi! This is Walk In Tattoo. You're up next! Please head inside when you're ready.";try{await navigator.clipboard.writeText(text);}catch(e){window.prompt('Copy this message to paste into Google Voice:',text);}const voiceUrl='https://voice.google.com/u/0/messages';window.open(voiceUrl,'_blank','noopener');message('Alert message copied. Open a new Google Voice message to '+phone+' and paste the text. Google Voice does not reliably support prefilled recipient and message links.');};remove.onclick=()=>change('cancelled');actions.append(alertBtn,remove);item.append(title,details,actions);container.append(item);});},message));});
</script></body></html>
